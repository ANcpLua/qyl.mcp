name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: bun install --frozen-lockfile
      # The packages import each other's types from dist; the type-aware rules resolve them
      # as error types (and stay silent) until everything is built.
      - run: bun run build
      - run: bun run lint

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the live collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ANcpLua/qyl
          path: qyl

      # The two repos ride the same contract by lockstep bumps, not by a pinned
      # ref — so name a cross-repo skew before the long build does, instead of
      # letting smoke:otlp fail at the spawned server's startup handshake on a
      # push that changed nothing here.
      # Inline here until it became the one gate nobody could run before pushing.
      # It is now verify-contract-pins.mjs, invoked identically from CI and from
      # `bun run verify:pins`, so there is one implementation rather than a
      # workflow copy and a local approximation.
      - name: Cross-repo contract pins must agree
        run: node verify-contract-pins.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: qyl/global.json

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - run: bun run smoke
      - name: Build live collector fixture
        run: |
          dotnet restore qyl/services/qyl.collector/qyl.collector.csproj \
            --configfile qyl/nuget.config \
            -p:TreatWarningsAsErrors=false
          dotnet build qyl/services/qyl.collector/qyl.collector.csproj \
            --configuration Release \
            --no-restore \
            -p:QylEmbedDashboard=false
          test -x qyl/artifacts/bin/qyl.collector/release/qyl.collector
      - name: Verify live OTLP and MCP contract surface
        run: bun run smoke:otlp
        env:
          QYL_COLLECTOR_PROJECT: ${{ github.workspace }}/qyl/services/qyl.collector/qyl.collector.csproj
