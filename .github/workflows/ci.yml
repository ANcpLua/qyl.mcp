name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the live collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ANcpLua/qyl
          path: qyl

      # The two repos ride the same contract by lockstep bumps, not by a pinned
      # ref — so name a cross-repo skew before the long build does, instead of
      # letting smoke:otlp fail at the spawned server's startup handshake on a
      # push that changed nothing here.
      - name: Cross-repo contract pins must agree
        run: |
          mcp_pin="$(node -p "require('./server/package.json').dependencies['@ancplua/qyl-api-schema']")"
          qyl_pin="$(sed -n 's:.*<QylApiContractsVersion[^>]*>\([^<]*\)</QylApiContractsVersion>.*:\1:p' qyl/Version.props)"
          if [ "$mcp_pin" != "$qyl_pin" ]; then
            echo "::error::cross-repo contract skew: this repo pins @ancplua/qyl-api-schema $mcp_pin, ANcpLua/qyl main pins Qyl.Api.Contracts $qyl_pin — smoke:otlp would fail its startup handshake. Land the lockstep bump on the lagging side first."
            exit 1
          fi
          echo "contract pins agree: $mcp_pin"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: qyl/global.json

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - name: Verify live OTLP and all seven tool contracts
        run: npm run smoke:otlp
        env:
          QYL_COLLECTOR_PROJECT: ${{ github.workspace }}/qyl/services/qyl.collector/qyl.collector.csproj
