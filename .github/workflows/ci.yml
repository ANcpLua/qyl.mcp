name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - run: bun install --frozen-lockfile
      # The packages import each other's types from dist; the type-aware rules resolve them
      # as error types (and stay silent) until everything is built.
      - run: bun run build
      - run: bun run lint

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the live collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ANcpLua/qyl
          path: qyl

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      # The two repos ride the same contract by lockstep bumps, not by a pinned
      # ref — so name a cross-repo skew before the long build does, instead of
      # letting smoke:otlp fail at the spawned server's startup handshake on a
      # push that changed nothing here.
      # Inline here until it became the one gate nobody could run before pushing.
      # It is now verify-contract-pins.mjs, invoked identically from CI and from
      # `bun run verify:pins`, so there is one implementation rather than a
      # workflow copy and a local approximation.
      - name: Cross-repo contract pins must agree
        run: node verify-contract-pins.mjs

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: qyl/global.json

      # The collector fixture (restore + Release build, ~55 s) needs only the qyl checkout and the
      # SDK, so it builds in the background while the bun build, tests, audit and smoke run.
      # "Build live collector fixture" below waits for it and fails with its exit code and log.
      - name: Start the live collector fixture build
        run: |
          # Every descriptor is redirected, so the step does not wait on the background job.
          # nice keeps the foreground bun tests at their usual pace; the build takes what is idle.
          {
            status=0
            nice -n 10 dotnet restore qyl/services/qyl.collector/qyl.collector.csproj \
              --configfile qyl/nuget.config \
              -p:TreatWarningsAsErrors=false &&
            nice -n 10 dotnet build qyl/services/qyl.collector/qyl.collector.csproj \
              --configuration Release \
              --no-restore \
              -p:QylEmbedDashboard=false || status=$?
            echo "$status" > "$RUNNER_TEMP/collector-build.exit"
          } > "$RUNNER_TEMP/collector-build.log" 2>&1 < /dev/null &

      - name: Enforce the SDK v2 dependency boundary
        run: bun run verify:sdk

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - name: Audit repository completion criteria
        run: |
          python3 -m venv "$RUNNER_TEMP/qyl-completion-audit"
          "$RUNNER_TEMP/qyl-completion-audit/bin/python" -m pip install \
            --disable-pip-version-check -r scripts/completion-audit-requirements.txt
          PATH="$RUNNER_TEMP/qyl-completion-audit/bin:$PATH" bun run verify:completion
      - run: bun run smoke
      - name: Build live collector fixture
        run: |
          while [ ! -s "$RUNNER_TEMP/collector-build.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/collector-build.log"
          status="$(cat "$RUNNER_TEMP/collector-build.exit")"
          if [ "$status" != 0 ]; then
            echo "::error::live collector fixture build failed with exit code $status"
            exit "$status"
          fi
          test -x qyl/artifacts/bin/qyl.collector/release/qyl.collector
      - name: Verify live OTLP and MCP contract surface
        run: bun run smoke:otlp
        env:
          QYL_COLLECTOR_PROJECT: ${{ github.workspace }}/qyl/services/qyl.collector/qyl.collector.csproj
      - name: Verify account and Events project isolation
        run: bun run smoke:projects
        env:
          QYL_COLLECTOR_PROJECT: ${{ github.workspace }}/qyl/services/qyl.collector/qyl.collector.csproj
