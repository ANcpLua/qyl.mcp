# The toolchain used by the local gate and Railway builds. Install with mise install.
[tools]
"bun" = "1.4.3"
# bun installs and runs the scripts; node runs `node --test`, the build and verify scripts,
# and the library consumers, so it stays inside every engines.node range (24.x).
# The qyl-mcp-server executable runs on Bun.
# Exact like bun: Railway builds and local mise resolve the same Node.
"node" = "24.21.0"

[tasks.check]
description = "Local release gate, one check at a time; a line per step, full log in artifacts/logs, QYL_VERBOSE=1 prints everything"
quiet = true
run = '''
scripts/quiet.sh check \
  'node --test scripts/verify-contract-pins.test.mjs' \
  'node verify-contract-pins.mjs' \
  'bun install --frozen-lockfile' \
  'bun run verify:sdk' \
  'bun run build' \
  'bun run lint' \
  'bun run test:built' \
  "python3 -m unittest discover -s tools/auth0 -p 'test_*.py'" \
  'bun run smoke' \
  'bun run --cwd server smoke:quiet' \
  'bun run --cwd server test:answer-key'
'''

[tasks.smoke-otlp]
description = "Live OTLP and MCP surface against a built collector; override with QYL_COLLECTOR_DLL"
quiet = true
run = "scripts/quiet.sh smoke-otlp 'bun run smoke:otlp'"

[tasks.hosted-eval]
description = "Every tool against mcp.qyl.at with a token from the Keychain"
run = [
  "tools/hosted-eval/run.sh",
]
