# The toolchain this repository builds with. CI installs it with jdx/mise-action;
# locally `mise install` does the same. dotnet also keeps global.json, which dotnet itself reads.
[tools]
"bun" = "1.4.3"
# bun installs and runs the scripts; node runs `node --test`, the build and verify scripts,
# and the published qyl-mcp-server, so it must stay inside every engines.node range (24.x).
# Exact like bun: CI, Railway builds and local mise resolve the same Node.
"node" = "24.21.0"

[tasks.check]
description = "The gate: what CI runs, in order"
run = [
  "node verify-contract-pins.mjs",
  "bun install --frozen-lockfile",
  "bun run build",
  "bun run lint",
  "bun run test",
  "python3 -m unittest discover -s tools/auth0 -p 'test_*.py'",
  "bun run smoke",
]

[tasks.smoke-otlp]
description = "Live OTLP and MCP surface against a built collector; set QYL_COLLECTOR_PROJECT to its csproj"
run = [
  "bun run smoke:otlp",
]

[tasks.hosted-eval]
description = "Every tool against mcp.qyl.at with a token from the Keychain"
run = [
  "tools/hosted-eval/run.sh",
]
